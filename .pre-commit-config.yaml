repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: true

      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources
        entry: cargo clippy -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false